<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animal Sports · Hockey in motion</title><link rel="stylesheet" href="../hockey.css"><style>body{margin:0;background:#092238;color:#e9f7ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}canvas{display:block;width:100%;height:auto;border-radius:18px}p{line-height:1.7}a{color:#a1e4ff}button{padding:10px 18px;border:0;border-radius:12px;color:#0b3e63;background:#b7e7fa;font:700 16px system-ui}</style><main><h1>Animal Sports · Hockey</h1><p>Actual game animation: a boy, a girl, and animal athletes on the ice. Ten players per team, skating legs, hockey sticks, goalies, and a coach’s whistle.</p><canvas width="960" height="600" aria-label="Animated ten-a-side hockey game preview"></canvas><h2>Choose your athlete</h2><canvas id="lineup" width="960" height="245" aria-label="Animated boy, girl, dragon, bird, bunny, dog and cat hockey athletes"></canvas><p><button type="button">Pause preview</button> · <a href="../">Play on Fun.Strite.art</a></p></main><script type="module">
import{createHockeyState,tickHockey,HOCKEY_DEFAULTS}from'../src/hockey-rules.js';import{drawHockey,drawHockeyAthlete}from'../src/hockey-art.js';const c=document.querySelector('canvas').getContext('2d'),l=document.querySelector('#lineup').getContext('2d');let s=createHockeyState(),last=0,time=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const b=document.querySelector('button');b.textContent=paused?'Play preview':'Pause preview';b.onclick=()=>{paused=!paused;b.textContent=paused?'Play preview':'Pause preview'};
function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused){time+=dt;tickHockey(s,dt,[{x:Math.sin(time*.7)*.6,y:Math.cos(time*.8)*.3}]);if(s.done)s=createHockeyState();}drawHockey(c,s);l.clearRect(0,0,960,245);const kinds=['human','human','dragon','bird','rabbit','dog','cat'];for(let i=0;i<7;i++){const x=70+i*137,look={...HOCKEY_DEFAULTS[i===1?'p2':'p1'],species:kinds[i],jersey:['#1979ca','#e05470','#348e72','#448ccd','#8e6fbe','#dd963a','#4c92a1'][i]};drawHockeyAthlete(l,{x,y:192,look,stride:time*9,vx:100,vy:0,facing:1,slot:i,human:0},time,{size:1.8});l.fillStyle='#e9f7ff';l.font='700 15px system-ui';l.textAlign='center';l.fillText(['Boy','Girl','Dragon','Bird','Bunny','Dog','Cat'][i],x,226);}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
