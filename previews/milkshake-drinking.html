<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A milkshake for your dragon</title><style>body{margin:0;padding:24px;background:#fff1e4;color:#50394d;font:16px system-ui}main{max-width:1000px;margin:auto}a{color:inherit}canvas{display:block;width:100%;border-radius:20px;margin-top:20px}button{padding:12px 20px;border:0;border-radius:10px;background:#704958;color:white;font:700 16px system-ui}</style><main><a href="../">← Back to games</a><h1>A milkshake for your dragon</h1><p>Watch your dragon walk up, sip through the straw, swallow, then step back to say thank you.</p><button>Replay</button><canvas width="900" height="620" aria-label="Dragon drinking a milkshake through a straw and saying thank you"></canvas></main><script type="module">
import {createIceRecipe,drawIceScene} from '../src/ice-cream.js';import {selectMilkshake} from '../src/milkshake.js';import {iceArtAtlas} from '../src/ice-art.js';import {playAtlas,playBackdropAtlas} from '../src/play-art.js';await Promise.all([iceArtAtlas('flavors'),iceArtAtlas('toppings'),playAtlas('objects'),playBackdropAtlas()].map(im=>im.decode()));const r=selectMilkshake({...createIceRecipe(),flavors:['chocolate'],toppings:['oreo','sauce']});r.blend={phase:'ready',time:9};const c=document.querySelector('canvas').getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let start=performance.now();document.querySelector('button').onclick=()=>start=performance.now();function paint(now){drawIceScene(c,r,900,620,reduced?3:(now-start)/1000%9,reduced);if(!reduced)requestAnimationFrame(paint);}paint(start);
</script></html>
