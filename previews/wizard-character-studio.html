<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Create your own character</title><link rel="stylesheet" href="../styles.css"><style>body{background:#ede7f6}main{max-width:1100px;margin:20px auto;padding:16px}</style></head><body><main id="studio"></main><script type="module">import{mountWizardStudio}from'../src/wizard-studio.js';const studio=mountWizardStudio(document.querySelector('main'),{onBack:()=>location.href='../'}),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;studio.open();function draw(now){studio.paint(reduced?0:now/1000);requestAnimationFrame(draw);}requestAnimationFrame(draw);</script></body></html>
