<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four Square · cover characters in motion</title><style>body{margin:0;background:#eaf0ed;color:#304958;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}p{line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{padding:12px 18px;border:1px solid #7d9c92;background:white;border-radius:10px;color:#244d4b;font:700 15px system-ui;cursor:pointer}button[aria-pressed=true]{background:#315eaa;color:white}.viewer canvas{display:block;width:100%;height:auto;border-radius:18px}img{max-width:100%;height:auto;border-radius:14px}a{color:#285e94}</style><main><h1>Four Square · the characters in motion</h1><p>The game’s actual 3D King, Queen, Knight, and Peasant. Choose a movement to see their faces, costumes, and connected limbs.</p><nav aria-label="Preview movement"><button data-pose="stand">Ready</button><button data-pose="run">Run</button><button data-pose="kneel">Kneel & stand</button><button data-pose="clap">Clap</button><button data-pose="hit">Hit the ball</button><button data-pause>Pause</button></nav><div class="viewer"><canvas width="960" height="700" aria-label="Actual animated Four Square character models"></canvas></div><p><a href="../">Back to the games</a></p><details><summary>Compare with the game’s front image</summary><img src="../assets/game-covers/four-square-still-v3.webp" width="960" height="540" alt="The original Four Square game cover used as the character reference"></details></main><script type="module">
import{createFourSquareScene}from'../src/four-square-scene.js';import{newFourSquare}from'../src/four-square-rules.js';import{tickFourSquareClap}from'../src/four-square-popcorn.js';const view=createFourSquareScene(document.querySelector('canvas'),{portrait:true}),s=newFourSquare(),buttons=document.querySelectorAll('[data-pose]');let mode='stand',time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;for(const b of buttons)b.onclick=()=>{mode=b.dataset.pose;time=0;s.phase='serve';s.popcorn=null;for(const k of s.kids){k.kneel=0;k.clapRemaining=0;k.clapQueued=0;k.clapProgress=null;}sync()};const pause=document.querySelector('[data-pause]');pause.onclick=()=>{paused=!paused;sync()};function sync(){for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.pose===mode));pause.textContent=paused?'Play':'Pause'}sync();function draw(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused)time+=dt;for(let i=0;i<6;i++){const k=s.kids[i];k.x=(i-1.5)*1.05;k.z=mode==='run'?time*2.8:0;k.heading=0;k.hit=mode==='hit'?Math.max(0,.4-(time+i*.19)%1.2):0;k.kneel=mode==='kneel'?Math.min(1,Math.max(0,Math.sin(time*1.5)*1.8)) :0;if(mode==='clap'&&!paused){if(!k.clapQueued&&!k.clapRemaining)k.clapQueued=1;tickFourSquareClap(k,dt);}}if(mode==='clap'){s.phase='popcorn';s.popcorn={actor:Math.floor(time/1.6)%4,stage:'turn',elapsed:1,deadline:2,claps:0,required:5,participants:[0,1,2,3],index:0};}else{s.phase='serve';s.popcorn=null;}view.render(s,time,paused?0:dt);requestAnimationFrame(draw)}requestAnimationFrame(draw);window.addEventListener('pagehide',()=>view.dispose(),{once:true});
</script></html>
