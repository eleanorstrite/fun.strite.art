<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Choose your wizard</title><link rel="stylesheet" href="../styles.css"><style>body{background:#efebf5}main{max-width:1000px;margin:28px auto;padding:24px}h1{font:600 32px system-ui;margin:0 0 12px}.preview-layout{display:grid;grid-template-columns:1fr 460px;gap:24px;align-items:start}.storm-wizards{grid-template-columns:repeat(3,minmax(0,1fr))}canvas{width:100%;height:auto;border-radius:18px}p{line-height:1.6}@media(max-width:650px){.preview-layout{grid-template-columns:1fr}canvas{max-width:360px;margin:auto}}</style></head><body><main><h1>Meet your tower-building wizards</h1><p>Choose a character to see them beside the tower. All six are free, and your choice carries into Wizard Tetris.</p><div class="preview-layout"><div id="choices"></div><canvas width="960" height="650" aria-label="Your selected wizard beside the Wizard Tetris tower"></canvas></div><p><a href="../">Play Wizard Tetris ↗</a></p></main><script type="module">
import{createStormState,drawStorm}from'../src/storm-stack.js';import{mountStormWizardChoices,loadStormWizard,saveStormWizard}from'../src/storm-wizards.js';
const s=createStormState(()=>.42),canvas=document.querySelector('canvas');s.wizard=loadStormWizard();for(let y=17;y<24;y++)for(let x=3;x<6;x++)s.board[y][x]=1+(x+y)%7;s.height=7;
mountStormWizardChoices(document.querySelector('#choices'),s.wizard,id=>{s.wizard=saveStormWizard(id);});const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now){s.elapsed=reduced?0:now/1000;drawStorm(canvas.getContext('2d'),s,960,650,reduced);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
