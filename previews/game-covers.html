<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidequest · Game cover gallery</title><style>body{margin:0;background:#f4f2eb;color:#292c37;font:16px system-ui}main{max-width:1240px;margin:40px auto;padding:0 24px}h1{font-size:clamp(30px,5vw,48px);margin:12px 0}p{color:#666b77;line-height:1.6}.covers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:30px 0}figure{margin:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 7px 25px #27304a12}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#252b43}figcaption{padding:14px 18px;font-weight:700}a{color:inherit}.play{display:inline-block;margin:12px 0;padding:12px 18px;background:#292e42;color:white;border-radius:9px;text-decoration:none}@media(max-width:650px){.covers{grid-template-columns:1fr}main{margin:24px auto;padding:0 16px}}</style></head><body><main><a class="play" href="../#library">Back to the games ↗</a><h1>Choose your next adventure.</h1><p>Fresh artwork for every game in the library. Tap a cover to open its full image.</p><div class="covers"></div><p><a href="../assets/game-covers/prompts.txt">Artwork files and imagegen prompts</a></p></main><script type="module">import{GAME_COVERS}from'../src/game-covers.js';const grid=document.querySelector('.covers');for(const cover of Object.values(GAME_COVERS)){const card=document.createElement('figure'),link=document.createElement('a'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src=new URL('../assets/game-covers/'+cover.file,import.meta.url).href;image.alt=cover.name+' cover artwork';image.width=1280;image.height=720;image.loading='lazy';link.href=image.src;link.append(image);caption.textContent=cover.name;card.append(link,caption);grid.append(card);}</script></body></html>
