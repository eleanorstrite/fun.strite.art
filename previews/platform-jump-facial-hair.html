<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Facial hair in motion</title>
<style>body{margin:0;background:#f5edde;color:#3c3530;font:16px system-ui}header{padding:24px 5vw}h1{margin:0 0 12px;font-size:28px}a{color:#76513d}main{padding:0 5vw 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}figure{margin:0;padding:12px;background:#fffaf2;border-radius:18px;text-align:center}canvas{display:block;width:100%;height:auto}figcaption{font-weight:700;margin:8px 0}</style>
<header><h1>Facial hair in motion</h1><p>Choose a moustache in the Facial hair box when designing your character. All styles are free.</p><a href="./platform-jump-facial-hair.svg">Animated picture of all fourteen styles</a> · <a href="../index.html">Back to the games</a></header><main></main>
<script type="module">
import {JUMP_FACIAL_HAIR} from '../src/platform-jump-facial-hair.js';import {drawJumper} from '../src/platform-jump-person.js';import {JUMP_DEFAULTS} from '../src/platform-jump-rules.js';
const tiles=JUMP_FACIAL_HAIR.map(facialHair=>{const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=360;c.height=450;label.textContent=facialHair;f.append(c,label);document.querySelector('main').append(f);return {facialHair,c};});
function paint(ms){const t=ms/1000;for(const {facialHair,c} of tiles){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#f5edde';x.fillRect(0,0,360,450);x.save();x.translate(180,415-Math.sin(t*1.5)*3);x.scale(3.1,3.1);drawJumper(x,0,0,{...JUMP_DEFAULTS,facialHair},t,false,t%8>5);x.restore();}requestAnimationFrame(paint);}requestAnimationFrame(paint);
</script></html>
