<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Animated sidekicks</title><link rel="stylesheet" href="../styles.css"><style>body{background:#ede7f6;color:#493763}main{max-width:1060px;margin:24px auto;padding:24px}h1{font:700 32px system-ui}p{line-height:1.6}.sidekick-demo{width:100%;height:auto;display:block;border-radius:20px}.wizard-sidekicks{margin:22px 0}a{color:#67458b}</style></head><body><main><h1>Choose your sidekick</h1><p>Tap the pet card to cycle through all cats, then dogs, then dragons. Stop when you find your favorite. Your choice saves for Wizard Tetris.</p><div id="picker"></div><canvas class="sidekick-demo" width="1040" height="980" aria-label="Animated previews of all seven cats, eight dogs and eight baby dragons"></canvas><p><a href="wizard-sidekicks.gif">Open the animated photo</a> · <a href="../">Play Wizard Tetris ↗</a></p></main><script type="module">import{mountWizardSidekicks,loadWizardSidekick,saveWizardSidekick}from'../src/wizard-sidekicks.js';import{drawSidekickGalleryFrame}from'../src/wizard-sidekick-preview.js';const canvas=document.querySelector('.sidekick-demo'),picker=mountWizardSidekicks(document.querySelector('#picker'),{selection:loadWizardSidekick(),onChoose:value=>saveWizardSidekick(value)}),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function draw(now){const time=reduced?0:now/1000;picker.paint(time);drawSidekickGalleryFrame(canvas,time);requestAnimationFrame(draw);}requestAnimationFrame(draw);</script></body></html>
