<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pet photo catalog</title><link rel="stylesheet" href="../styles.css">
<style>body{background:#f5f1e8}.pet-lookbook{max-width:1100px;padding:32px 24px}.pet-lookbook h1{font-size:38px;letter-spacing:-1px}.pet-lookbook .jump-editor{display:block}.pet-lookbook .jump-pet-types{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.pet-lookbook .jump-pet-breed-photos{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.pet-lookbook select{max-width:300px}.pet-lookbook>p{line-height:1.6}.pet-lookbook #pet-selected{font-weight:700;color:#5c4779}</style>
<main class="pet-lookbook"><h1>Meet your pets</h1><p>Compare all 54 looks across nine animal types. Each photo uses the same artwork as the game. Special rainbow, tutu and tuxedo looks unlock in the shop.</p><p id="pet-selected" role="status">Dog · Brindle</p><div class="jump-editor"><fieldset id="pet-photos"><label>Animal<select id="pet-type"></select></label></fieldset></div><a class="button dark" href="../index.html">Back to the games</a></main>
<script type="module">
import {PET_BREEDS,JUMP_DEFAULTS,validateJumpSettings} from '../src/platform-jump-rules.js';import {mountPetGallery,petTypeBreed} from '../src/platform-pet-gallery.js';
let settings={...JUMP_DEFAULTS};const field=document.querySelector('#pet-type'),abort=new AbortController();for(const pet of Object.keys(PET_BREEDS)){const option=document.createElement('option');option.value=pet;option.textContent=pet[0].toUpperCase()+pet.slice(1);field.append(option);}field.value=settings.pet;
const gallery=mountPetGallery({parent:document.querySelector('#pet-photos'),petField:field,getSettings:()=>settings,getUpgrades:()=>[],signal:abort.signal,onSelect:select});function select(pet,breed){settings=validateJumpSettings({...settings,pet,breed});field.value=settings.pet;document.querySelector('#pet-selected').textContent=settings.pet[0].toUpperCase()+settings.pet.slice(1)+' · '+settings.breed;gallery.paint();}field.addEventListener('change',()=>select(field.value,petTypeBreed(field.value)));gallery.paint();
</script></html>
