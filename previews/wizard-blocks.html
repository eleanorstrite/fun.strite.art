<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Realistic blocks</title><style>body{margin:0;background:#10182d;color:#f6ebd0;font:16px system-ui}main{max-width:1040px;margin:24px auto;padding:24px}h1{font-size:32px}canvas{width:100%;height:auto;border-radius:20px}p{line-height:1.6}a{color:#add8ff}</style></head><body><main><h1>Enchanted materials</h1><p>Galaxy glass, reflective gold, electric blue crystal, and iridescent rainbow glass. These are the same block materials used in Wizard Tetris.</p><canvas width="960" height="560" aria-label="Close-up previews of the four realistic block materials"></canvas><p><a href="../">Play Wizard Tetris ↗</a></p></main><script type="module">

</script></body></html>
