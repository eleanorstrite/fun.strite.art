<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidequest · Realistic scenery</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f4f2eb;color:#242820;font:16px system-ui}header,main{max-width:1200px;margin:auto}header{margin-bottom:28px}h1{font-size:36px;margin:18px 0 10px}a{color:inherit}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;overflow:hidden;border-radius:18px;background:white;box-shadow:0 5px 24px #26382b16}img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}figcaption{padding:16px;font-weight:700}@media(max-width:650px){body{padding:18px}h1{font-size:28px}main{grid-template-columns:1fr}}</style><header><a href="../">← Back to games</a><h1>Realistic website scenery</h1><p>Choose these backgrounds in “Pick your scenery” on the home page. Northern Lights and Enchanted Forest retain their shop unlocks.</p></header><main></main><script type="module">
import {BACKGROUNDS} from '../src/backgrounds.js';for(const scene of BACKGROUNDS.filter(s=>s.id!=='classic')){const figure=document.createElement('figure'),a=document.createElement('a'),image=document.createElement('img'),caption=document.createElement('figcaption');a.href='../assets/backgrounds/'+scene.id+'-realistic.jpg';image.src=a.href;image.alt=scene.name+' realistic scenery';caption.textContent=scene.name;a.append(image);figure.append(a,caption);document.querySelector('main').append(figure);}
</script></html>
