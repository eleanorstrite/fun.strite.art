<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Platform Jump clothing in motion</title>
<style>body{margin:0;background:#f0edf4;color:#282735;font:16px system-ui}header{padding:24px 5vw}h1{margin:0 0 12px;font-size:28px}a{color:#51558b}main{padding:0 5vw 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}figure{margin:0;padding:12px;background:white;border-radius:20px;text-align:center}canvas{display:block;width:100%;height:auto}figcaption{font-weight:700;margin:8px 0}</style>
<header><h1>Your outfits, in motion</h1><p>All nine reference outfits on the game's character. Choose Clothing in the character editor to wear one.</p><a href="./platform-jump-outfit.svg">Animated picture of the cover girl</a> · <a href="../index.html">Back to the games</a></header><main></main>
<script type="module">
import {JUMP_OUTFITS} from '../src/platform-jump-clothes.js';import {drawJumper} from '../src/platform-jump-person.js';import {JUMP_DEFAULTS} from '../src/platform-jump-rules.js';
const tiles=JUMP_OUTFITS.slice(1).map(outfit=>{const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=420;c.height=520;label.textContent=outfit;f.append(c,label);document.querySelector('main').append(f);return {outfit,c};});
function paint(ms){const t=ms/1000;for(const {outfit,c} of tiles){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const g=x.createLinearGradient(0,0,0,520);g.addColorStop(0,'#e7f0fa');g.addColorStop(1,'#efe4f4');x.fillStyle=g;x.fillRect(0,0,420,520);x.fillStyle='#61597625';x.beginPath();x.ellipse(210,475,100,13,0,0,Math.PI*2);x.fill();x.save();x.translate(210,465-Math.sin(t*1.5)*3);x.scale(3.5,3.5);drawJumper(x,0,0,{...JUMP_DEFAULTS,outfit,hairstyle:'Sunset blossom waves',hair:'#ee702e'},t);x.restore();}requestAnimationFrame(paint);}requestAnimationFrame(paint);
</script></html>
