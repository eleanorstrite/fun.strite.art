<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a milkshake · Sidequest</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff1e2;color:#563f52;font:16px system-ui}header,main{max-width:1240px;margin:auto}a{color:inherit}h1{margin:18px 0 10px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}article{overflow:hidden;border:2px solid #e9b9ca;border-radius:20px;background:#fffcf6}h2{margin:15px 18px;font-size:20px}canvas{display:block;width:100%;height:auto}@media(max-width:650px){body{padding:14px}main{grid-template-columns:1fr}h1{font-size:28px}}</style><header><a href="../">← Back to games</a><h1>Make a milkshake</h1><p>Choose ice cream and up to three toppings. Blend, sparkle, then let your dragon sip through the straw!</p></header><main></main><script type="module">
import {createIceRecipe,drawIceScene} from '../src/ice-cream.js';import {selectMilkshake} from '../src/milkshake.js';import {iceArtAtlas} from '../src/ice-art.js';import {playAtlas,playBackdropAtlas} from '../src/play-art.js';const images=['flavors','cones','toppings'].map(iceArtAtlas).concat(playAtlas('objects'),playBackdropAtlas());await Promise.all(images.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;})));
const stages=['1. Count down: 3, 2, 1','2. Watch your toppings swirl','3. A sparkling finished shake','4. Your dragon drinks through the straw'];const cards=[];stages.forEach((title,i)=>{const article=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas');h.textContent=title;canvas.width=900;canvas.height=620;article.append(h,canvas);document.querySelector('main').append(article);const recipe=selectMilkshake({...createIceRecipe(),flavor:i===2?'blueberry':'strawberry',flavors:[i===2?'blueberry':'strawberry'],toppings:i===2?['berries','cream','blueberrySauce']:['oreo','banana','cream']});cards.push({c:canvas.getContext('2d'),recipe});});const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;function paint(now){const t=reduced?1:now/1000;cards.forEach(({c,recipe},i)=>{recipe.blend=i===0?{phase:'countdown',time:t%3}:i===1?{phase:'blending',time:3+t%5}:i===2?{phase:'ready',time:8+t%2}:{phase:'ready',time:10};drawIceScene(c,recipe,900,620,i===3?(reduced?3:t%8.5):null,reduced);});if(!reduced)requestAnimationFrame(paint);}paint(0);
