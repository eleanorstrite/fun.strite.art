<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Boy outfits</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#151a32;color:#fff2cf;font:16px system-ui}a{color:#c4dfff}h1{margin:16px 0 8px}.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;max-width:1200px;margin:auto}article{background:linear-gradient(#28314f,#424367);border:1px solid #6c6a83;border-radius:20px;overflow:hidden;text-align:center}canvas{width:100%;height:auto;display:block}h2{font-size:16px;margin:0 8px 16px}header{max-width:1200px;margin:0 auto 26px}@media(max-width:650px){body{padding:15px}.looks{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><header><a href="../">← Back to games</a><h1>Wizard Tetris · Boy outfits</h1><p>Wizard coats, adventurer jackets, trousers and boots, fitted for adults and kids.</p></header><main class="looks"></main><script type="module">
import {CUSTOM_OUTFITS,customWizardAtlas,drawCustomWizard} from '../src/wizard-custom.js';
const images=['boy-outfits','adult-heads','kid-heads'].map(customWizardAtlas);await Promise.all(images.map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=resolve;im.onerror=resolve;})));const items=[];
for(const age of ['adult','kid'])for(let i=0;i<4;i++){const article=document.createElement('article'),canvas=document.createElement('canvas'),caption=document.createElement('h2');canvas.width=300;canvas.height=440;caption.textContent=(age==='kid'?'Kid · ':'Adult · ')+CUSTOM_OUTFITS[12+i];article.append(canvas,caption);document.querySelector('main').append(article);items.push({c:canvas.getContext('2d'),look:{age,hair:i,outfit:12+i}});}
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;function paint(now){for(const {c,look}of items){c.clearRect(0,0,300,440);drawCustomWizard(c,look,145,420,now/1000,{height:360,reduced});}if(!reduced)requestAnimationFrame(paint);}paint(0);
</script></html>
