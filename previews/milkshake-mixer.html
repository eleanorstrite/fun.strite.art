<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milkshake mixer preview</title><style>body{margin:0;padding:24px;background:#fff1e4;color:#50394d;font:16px system-ui}main{max-width:1200px;margin:auto}a{color:inherit}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}canvas{width:100%;border-radius:18px}button{padding:12px;border:0;border-radius:9px;background:#704958;color:white}</style><main><a href="../">← Back to games</a><h1>From mixing bowl to milkshake</h1><p>Add your toppings, blend the chunks smaller, then share a creamy shake with your dragon.</p><button>Replay blending</button><section><div><h2>Fill your bowl</h2><canvas width="900" height="620"></canvas></div><div><h2>Blend and chop</h2><canvas width="900" height="620"></canvas></div><div><h2>Your finished shake</h2><canvas width="900" height="620"></canvas></div></section></main><script type="module">
import {createIceRecipe,drawIceScene} from '../src/ice-cream.js';import {selectMilkshake} from '../src/milkshake.js';import {iceArtAtlas} from '../src/ice-art.js';import {playBackdropAtlas} from '../src/play-art.js';await Promise.all([iceArtAtlas('flavors'),iceArtAtlas('toppings'),playBackdropAtlas()].map(im=>im.decode()));const recipe=selectMilkshake({...createIceRecipe(),flavors:['cookies','chocolate'],toppings:['sauce','oreo','banana']});recipe.sauceDrops=[{kind:'sauce',x:-20,y:-35,amount:1},{kind:'sauce',x:26,y:-15,amount:1}];const canvases=[...document.querySelectorAll('canvas')];let start=performance.now();document.querySelector('button').onclick=()=>start=performance.now();const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;function paint(now){const time=reduced?4.5:((now-start)/1000)%11;canvases.forEach((canvas,i)=>{const r={...recipe,blend:i===0?{phase:'choosing',time:0}:i===2?{phase:'ready',time:9}: {phase:time<3?'countdown':time<8?'blending':'ready',time}};drawIceScene(canvas.getContext('2d'),r,900,620,null,reduced);});if(!reduced)requestAnimationFrame(paint);}paint(start);
</script></html>
