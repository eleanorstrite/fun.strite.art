<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make Your Own Ice Cream · New menu</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff2e2;color:#543e48;font:16px system-ui}header,main{max-width:1400px;margin:auto}a{color:inherit}h1{margin:18px 0 8px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}article{background:linear-gradient(#fffcf5,#f8d7d7);border:2px solid #e1b8bd;border-radius:22px;overflow:hidden;text-align:center}canvas{display:block;width:100%;height:auto}h2{font-size:18px;margin:0 14px 10px}article p{font-size:13px;line-height:1.5;margin:0 14px 20px}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){body{padding:14px}main{gap:10px}h2{font-size:15px}article p{font-size:12px}}</style><header><a href="../">← Back to games</a><h1>Your new ice cream menu</h1><p>22 flavors, 10 cones and bowls, and 30 toppings and syrups. Mix up to three flavors, then decorate your dessert!</p></header><main></main><script type="module">
import {createIceRecipe,drawIceDessert,pourIceChocolate,tickIceChocolate} from '../src/ice-cream.js';import {iceArtAtlas} from '../src/ice-art.js';
await Promise.all(['flavors','cones','toppings'].map(kind=>{const im=iceArtAtlas(kind);return im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;});}));
const samples=[['Nutty fish cone','Pistachio, vanilla & almond, maple & walnut.',['pistachio','vanillaalmond','maplewalnut'],'fish',['almonds','walnuts','caramel']],['Berry waffle bowl','Strawberry, blueberry, mascarpone.',['strawberry','blueberry','mascarpone'],'bowl',['raspberries','banana','strawberries','strawberrySyrup']],['Rainbow dipped cone','Rainbow, marshmallow, cherry ripple.',['rainbow','marshmallow','cherry'],'dipped',['sprinkles','mms','cream','cherry']],['Chocolate celebration','Rocky road, orange & chocolate, Neapolitan.',['rockyroad','orangechocolate','neapolitan'],'waffle',['oreo','chocolatePieces','waferRolls','sauce']]];
const cards=[];for(const [title,detail,flavors,cone,toppings]of samples){const article=document.createElement('article'),canvas=document.createElement('canvas'),h=document.createElement('h2'),p=document.createElement('p');canvas.width=350;canvas.height=620;h.textContent=title;p.textContent=detail;article.append(canvas,h,p);document.querySelector('main').append(article);const recipe={...createIceRecipe(),cone,flavor:flavors[0],flavors,toppings};for(const id of ['caramel','sauce','strawberrySyrup'])if(toppings.includes(id))for(const x of [-25,0,25])pourIceChocolate(recipe,x,-40,.5,id);cards.push({c:canvas.getContext('2d'),recipe});}
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let previous=0;function paint(now){const dt=previous?Math.min(.1,(now-previous)/1000):0;previous=now;for(const {c,recipe}of cards){tickIceChocolate(recipe,dt);c.clearRect(0,0,350,620);drawIceDessert(c,recipe,175,410,1.2);}if(!reduced)requestAnimationFrame(paint);}paint(0);
</script></html>
