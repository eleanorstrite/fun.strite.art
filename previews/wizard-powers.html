<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Tetris · Helping & attack powers</title><style>body{margin:0;background:#14243a;color:#f7eccd;font:16px system-ui}main{max-width:1000px;margin:auto;padding:26px}h1{font-size:32px}.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.power{background:#22374d;padding:16px;border:2px solid #65b6a2;border-radius:20px;text-align:center}.power.attack{border-color:#d884ad;background:#35263e}.power canvas{width:100%;max-width:180px;height:auto}.power p{line-height:1.6;font-size:14px}.power small{font-weight:800;letter-spacing:2px}a{color:#a4dfff}@media(max-width:600px){.powers{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>Choose your magic</h1><p>Cross the rainbow diamond line to level up. Pick one of three powers; Helping aids your tower and Attack sabotages your opponent. The gold strip is the finish.</p><div class="powers"></div><p><a href="../">Play Wizard Tetris ↗</a></p></main><script type="module">import{WIZARD_POWERS,wizardPowerAtlas,drawWizardPowerIcon}from'../src/wizard-powers.js';for(const power of WIZARD_POWERS){const card=document.createElement('article');card.className='power '+power.type.toLowerCase();const category=document.createElement('small');category.textContent=power.type.toUpperCase();const image=document.createElement('canvas');image.width=200;image.height=200;const name=document.createElement('h2');name.textContent=power.name;const detail=document.createElement('p');detail.textContent=power.detail;card.append(category,image,name,detail);document.querySelector('.powers').append(card);const paint=()=>{image.getContext('2d').clearRect(0,0,200,200);drawWizardPowerIcon(image.getContext('2d'),power.id,0,0,200);};paint();wizardPowerAtlas().addEventListener('load',paint,{once:true});}</script></body></html>
